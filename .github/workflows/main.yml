name: Build Android App v4

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Project and Assets v4
      run: |
        mkdir -p app/src/main/assets
        cp -r * app/src/main/assets/ 2>/dev/null || true
        # استثناء مجلد التطبيق وملف الـ workflow من النسخ الداخلي لتجنب التكرار
        rm -rf app/src/main/assets/.github app/src/main/assets/app

    - name: Upload Build Artifact v4
      uses: actions/upload-artifact@v4
      with:
        name: Tamoh2030-App-v4
        path: app/
